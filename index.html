<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebAR Cá</title>

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- Loader OBJ -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.loaders.min.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene
    embedded
    vr-mode-ui="enabled:false"
    arjs="sourceType:webcam; debugUIEnabled:false;">

    <a-assets>
        <a-asset-item
            id="fishObj"
            src="./assets/fish.obj">
        </a-asset-item>

        <a-asset-item
            id="fishMtl"
            src="./assets/fish.mtl">
        </a-asset-item>
    </a-assets>

    <a-marker preset="hiro">

       <a-entity
    obj-model="obj: #fishObj; mtl: #fishMtl"
    position="0 -100 0"
    rotation="-90 0 0"
    scale="0.0005 0.0005 0.0005">
</a-entity>
    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

</body>
</html>
