<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>WebAR Fish OBJ</title>

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- OBJ + MTL Loader -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.loaders.min.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene
    embedded
    vr-mode-ui="enabled:false"
    renderer="logarithmicDepthBuffer:true;"
    arjs="trackingMethod:best; sourceType:webcam; debugUIEnabled:false;">

    <a-assets>
        <a-asset-item id="fishObj" src="assets/fish.obj"></a-asset-item>
        <a-asset-item id="fishMtl" src="assets/fish.mtl"></a-asset-item>
    </a-assets>

    <a-marker preset="hiro">

        <a-light type="ambient" intensity="2"></a-light>
        <a-light type="directional" position="2 4 2" intensity="2"></a-light>

        <a-entity
            obj-model="obj:#fishObj; mtl:#fishMtl"
            position="0 0 0"
            rotation="-90 0 0"
            scale="0.01 0.01 0.01">
        </a-entity>

    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

</body>
</html>
